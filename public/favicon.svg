<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aurelianGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeccb"/>
      <stop offset="40%" stop-color="#d2b77f"/>
      <stop offset="100%" stop-color="#9a7a3b"/>
    </linearGradient>
  </defs>
  <!-- Dark container for browser tab title bar visibility (light & dark modes) -->
  <rect width="64" height="64" rx="14" fill="#0b0b0a"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="url(#aurelianGold)" stroke-width="1.2" stroke-opacity="0.3"/>
  
  <!-- Architectural diamond monogram -->
  <g transform="translate(32, 32)">
    <!-- Outer diamond -->
    <polygon points="0,-21 21,0 0,21 -21,0" fill="none" stroke="url(#aurelianGold)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Inner diamond -->
    <polygon points="0,-13 13,0 0,13 -13,0" fill="none" stroke="url(#aurelianGold)" stroke-width="1.2" stroke-opacity="0.7"/>
    
    <!-- Architectural cross-beam forming monogram A -->
    <line x1="-8" y1="5" x2="8" y2="5" stroke="url(#aurelianGold)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Central architectural pivot -->
    <circle cx="0" cy="0" r="2.2" fill="url(#aurelianGold)"/>
  </g>
</svg>
